# Glosar medical RO / RU / EN pentru mediul clinic din Republica Moldova.
# - terms: forma canonică (folosită în promptul Whisper și în corectarea fuzzy)
# - variants: erori ASR reale observate (inclusiv pronunție moldovenească) -> forma corectă
# Extensibil fără cod: adăugați termeni noi aici, pipeline-ul îi preia automat.

prompt_seed:
  # neutru: fără pacienți, paturi sau cifre concrete (altfel Whisper e „împins” să le audă și pe alte înregistrări);
